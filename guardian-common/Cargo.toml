# =============================================================================
# Guardian Common - Shared Types
# =============================================================================
#
# This crate contains type definitions shared between the eBPF kernel program
# and the userspace daemon. Because eBPF programs run in a constrained
# environment (no standard library, no heap allocation), this crate MUST be
# `no_std` compatible.
#
# Rules for this crate:
#   - NO external dependencies (keeps it compatible with both environments)
#   - All structs must be #[repr(C)] for stable memory layout across
#     kernel/userspace boundary
#   - All structs must be Copy + Clone (eBPF maps require this)
#   - Use fixed-size arrays, never Vec or String

[package]
name = "guardian-common"
version = "0.11.0"
edition = "2021"
description = "Shared types between Guardian Shell eBPF and userspace components"

[features]
default = []
# Enable this feature in userspace code for std-dependent functionality
user = ["aya", "serde", "serde_json"]

[dependencies]
aya = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
