[global]
log_level = "info"
mode = "enforce"
pid_rescan_interval = 5
socket_path = "/run/guardian.sock"

[dashboard]
enabled = true
listen_address = "127.0.0.1:8080"

[alerting]
min_severity = "warning"
dedup_window_seconds = 300
rate_limit_per_minute = 100

[alerting.json_log]
enabled = true
path = "/var/log/guardian/events.json"
max_size_mb = 100
max_files = 5

[alerting.prometheus]
enabled = true
listen_address = "127.0.0.1:9090"
endpoint = "/metrics"

[[agents]]
name = "claude-code"
process_name = "claude"
watch_children = true

[agents.file_access]
default = "deny"
allow = [
    "/home/suren/codebrahma/llm_allowed/**",
    "/home/suren/codebrahma/guardian_shell/**",
    "/home/suren/**",
    "/home/**",
    "/tmp/**",
    "/proc/**",
    "/sys/**",
    "/dev/**",
    "/usr/lib/**",
    "/usr/lib64/**",
    "/usr/libexec/**",
    "/usr/share/**",
    "/usr/local/**",
    "/usr/bin/**",
    "/usr/sbin/**",
    "/lib/**",
    "/lib64/**",
    "/bin/**",
    "/etc/**",
    "/run/**",
    "/var/**",
]
deny = [
    "/home/suren/codebrahma/llm_not_allowed/**",
    "/etc/shadow",
    "/etc/gshadow",
    "/home/suren/.ssh/**",
    "/home/suren/.gnupg/**",
    "/home/suren/.aws/**",
]

[agents.exec_policy]
default = "allow"
allow = [
    "/usr/bin/**",
    "/usr/libexec/**",
    "/usr/local/bin/**",
    "/bin/**",
]
deny = [
    "/usr/bin/grep",
]

[agents.network_policy]
default = "allow"
deny_ports = [8000]

[[agents]]
name = "claude-cgroup"
identity = "cgroup"
watch_children = true

[agents.file_access]
default = "deny"
allow = [
    # Project workspace
    "/home/suren/codebrahma/**",

    # Home directory (Claude needs dotfiles, configs, cache)
    "/home/suren/**",

    # Claude binary + node (installed via mise)
    "/home/suren/.local/**",

    # Temp and runtime
    "/tmp/**",
    "/proc/**",
    "/sys/**",
    "/dev/**",
    "/run/**",
    "/var/tmp/**",

    # Shared libraries and system binaries
    "/usr/lib/**",
    "/usr/lib64/**",
    "/usr/libexec/**",
    "/usr/share/**",
    "/usr/local/**",
    "/usr/bin/**",
    "/usr/sbin/**",
    "/lib/**",
    "/lib64/**",
    "/bin/**",

    # System config (deny rules protect /etc/shadow, /etc/gshadow)
    "/etc/**",
    "/var/**",
]
deny = [
    "/home/suren/codebrahma/.env",
    "/etc/shadow",
    "/etc/gshadow",
    "/home/suren/.ssh/**",
    "/home/suren/.aws/**",
    "/home/suren/.gnupg/**",
]

[agents.exec_policy]
default = "allow"
allow = [
    "/usr/bin/**",
    "/usr/libexec/**",
    "/usr/local/bin/**",
    "/bin/**",
]
deny = [
    "/usr/bin/grep",
]

[agents.network_policy]
default = "allow"
deny_ports = [8000]

