# to = ["security-team@example.com", "oncall@example.com"]
# min_severity = "critical"

# --- Prometheus Metrics Endpoint ---
[alerting.prometheus]
enabled = true
listen_address = "127.0.0.1:9090"
endpoint = "/metrics"

