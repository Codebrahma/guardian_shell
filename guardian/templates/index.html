{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block nav_index %}nav-active{% endblock %}

{% block content %}
<h2 class="section-title">Dashboard Overview</h2>

<!-- Status Cards (auto-refresh every 5s) -->
<div id="status-cards"
     hx-get="/api/status"
     hx-trigger="load, every 5s"
     hx-swap="innerHTML">
  <div class="grid-4">
    <div class="stat-card"><div class="skeleton" style="height: 48px;"></div></div>
    <div class="stat-card"><div class="skeleton" style="height: 48px;"></div></div>
    <div class="stat-card"><div class="skeleton" style="height: 48px;"></div></div>
    <div class="stat-card"><div class="skeleton" style="height: 48px;"></div></div>
  </div>
</div>

<!-- Recent Events via SSE -->
<div class="mt-lg" x-data="recentEvents()">
  <div class="flex items-center gap-md mb-md">
    <h3 class="section-subtitle mb-0">Recent Events</h3>
    <span class="conn-status">
      <span class="conn-dot" :class="connected ? 'connected' : 'disconnected'"></span>
      <span :style="connected ? 'color: var(--success)' : 'color: var(--danger)'"
            x-text="connected ? 'Live' : 'Reconnecting...'"></span>
    </span>
  </div>
  <div class="card">
    <div class="table-wrap" style="max-height: 60vh; overflow-y: auto;">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Severity</th>
            <th>Agent</th>
            <th>Type</th>
            <th>Action</th>
            <th>Path</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="ev in events" :key="ev.id">
            <tr>
              <td class="nowrap text-xs" x-text="formatTime(ev.timestamp)"></td>
              <td>
                <span class="badge"
                      :class="{'badge-info': ev.severity==='info', 'badge-warning': ev.severity==='warning', 'badge-critical': ev.severity==='critical'}"
                      x-text="ev.severity"></span>
              </td>
              <td class="text-primary" x-text="ev.agent_name"></td>
              <td class="text-xs" x-text="ev.event_type"></td>
              <td>
                <span class="badge"
                      :class="{'badge-success': ev.action==='allow', 'badge-warning': ev.action==='deny', 'badge-critical': ev.action==='blocked'}"
                      x-text="ev.action"></span>
              </td>
              <td class="cell-path" x-text="ev.path" :title="ev.path"></td>
            </tr>
          </template>
          <tr x-show="events.length === 0">
            <td colspan="6" class="empty-state">Waiting for events...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function recentEvents() {
  return {
    events: [],
    nextId: 0,
    connected: false,
    sse: null,
    retryDelay: 1000,

    init() { this.connect(); },

    connect() {
      if (this.sse) { this.sse.close(); this.sse = null; }
      this.sse = new EventSource('/events/stream');
      this.sse.onopen = () => { this.connected = true; this.retryDelay = 1000; };
      this.sse.addEventListener('event', (e) => {
        try {
          const data = JSON.parse(e.data);
          data.id = this.nextId++;
          this.events.unshift(data);
          if (this.events.length > 50) this.events.pop();
        } catch(err) {}
      });
      this.sse.addEventListener('lag', () => {});
      this.sse.onerror = () => {
        this.connected = false;
        this.sse.close(); this.sse = null;
        const delay = Math.min(this.retryDelay, 30000);
        this.retryDelay = Math.min(this.retryDelay * 2, 30000);
        setTimeout(() => this.connect(), delay);
      };
    },

    formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString() + '.' + String(d.getMilliseconds()).padStart(3, '0');
    }
  };
}
</script>
{% endblock %}
