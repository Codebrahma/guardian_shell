<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Shell — {% block title %}Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .nav-active { background-color: rgba(59, 130, 246, 0.1); color: #2563eb; border-left: 3px solid #2563eb; }
    .severity-info { color: #3b82f6; }
    .severity-warning { color: #f59e0b; }
    .severity-critical { color: #ef4444; }
    .action-allow { color: #10b981; }
    .action-deny { color: #f59e0b; }
    .action-blocked { color: #ef4444; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <nav class="w-56 bg-white shadow-sm min-h-screen border-r border-gray-200 fixed">
      <div class="p-4 border-b border-gray-200">
        <h1 class="text-lg font-bold text-gray-800">Guardian Shell</h1>
        <p class="text-xs text-gray-400 mt-1">Security Dashboard</p>
      </div>
      <ul class="mt-2 space-y-1 px-2">
        <li>
          <a href="/" class="block px-3 py-2 rounded text-sm text-gray-700 hover:bg-gray-100 {% block nav_index %}{% endblock %}">
            Overview
          </a>
        </li>
        <li>
          <a href="/events" class="block px-3 py-2 rounded text-sm text-gray-700 hover:bg-gray-100 {% block nav_events %}{% endblock %}">
            Live Events
          </a>
        </li>
        <li>
          <a href="/agents" class="block px-3 py-2 rounded text-sm text-gray-700 hover:bg-gray-100 {% block nav_agents %}{% endblock %}">
            Agents
          </a>
        </li>
        <li>
          <a href="/policy" class="block px-3 py-2 rounded text-sm text-gray-700 hover:bg-gray-100 {% block nav_policy %}{% endblock %}">
            Policy Editor
          </a>
        </li>
        <li>
          <a href="/alerts" class="block px-3 py-2 rounded text-sm text-gray-700 hover:bg-gray-100 {% block nav_alerts %}{% endblock %}">
            Alert Config
          </a>
        </li>
        <li>
          <a href="/metrics" target="_blank" class="block px-3 py-2 rounded text-sm text-gray-700 hover:bg-gray-100">
            Metrics
          </a>
        </li>
      </ul>
      <div class="absolute bottom-4 left-0 right-0 px-4">
        <button hx-post="/api/config/reload" hx-target="#toast" hx-swap="innerHTML"
                class="w-full px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm rounded">
          Reload Config
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="ml-56 flex-1 p-6">
      <div id="toast" class="mb-4"></div>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
