# Guardian Shell — Strict Configuration
# Maximum security. Explicit allow-only with all alerting outputs.
# Use this as a starting point and add only what the agent needs.

[global]
log_level = "info"
mode = "enforce"
pid_rescan_interval = 3
socket_path = "/run/guardian.sock"

# --- Alerting (all outputs enabled) ---
[alerting]
min_severity = "info"
dedup_window_seconds = 60
rate_limit_per_minute = 500

[alerting.json_log]
enabled = true
path = "/var/log/guardian/events.json"
max_size_mb = 200
max_files = 10

# Uncomment and configure webhook for SIEM integration:
# [alerting.webhook]
# enabled = true
# url = "https://siem.example.com/api/v1/events"
# auth_header = "Bearer <token>"
# min_severity = "warning"

# Uncomment and configure Slack:
# [alerting.slack]
# enabled = true
# webhook_url = "https://hooks.slack.com/services/..."
# min_severity = "critical"

# Uncomment and configure email:
# [alerting.email]
# enabled = true
# smtp_host = "smtp.example.com"
# smtp_port = 587
# username = "alerts@example.com"
# password = "<password>"
# from = "guardian@example.com"
# to = ["security@example.com"]
# min_severity = "critical"

[alerting.prometheus]
enabled = true
listen_address = "127.0.0.1:9090"
endpoint = "/metrics"

# --- Agent: strictly sandboxed LLM agent ---
[[agents]]
name = "sandboxed-agent"
identity = "cgroup"

[agents.file_access]
default = "deny"
allow = [
    # Only the project directory — nothing else
    "/home/user/project/**",
    # Bare minimum system libraries
    "/usr/lib/**",
    "/usr/lib64/**",
    "/lib/**",
    "/lib64/**",
    "/etc/ld.so.cache",
    "/etc/localtime",
    "/proc/self/**",
]
deny = [
    "/home/user/.ssh/**",
    "/home/user/.aws/**",
    "/home/user/.gnupg/**",
    "/home/user/.env",
    "/home/user/.config/**",
    "/etc/shadow",
    "/etc/gshadow",
]

[agents.exec_policy]
default = "deny"
allow = [
    "/usr/bin/git",
    "/usr/bin/python3",
    "/usr/bin/node",
    "/usr/bin/npm",
    "/usr/bin/ls",
    "/usr/bin/cat",
    "/usr/bin/grep",
    "/usr/bin/find",
    "/usr/bin/sed",
    "/usr/bin/awk",
]
deny = []

[agents.resources]
memory_max = "2G"
pids_max = 100
cpu_max = "100000 100000"
