[global]
log_level = "info"
mode = "enforce"
pid_rescan_interval = 5
socket_path = "/run/guardian.sock"

[dashboard]
enabled = true
listen_address = "127.0.0.1:8080"

[alerting]
min_severity = "warning"
dedup_window_seconds = 300
rate_limit_per_minute = 100

[alerting.json_log]
enabled = true
path = "/var/log/guardian/events.json"
max_size_mb = 100
max_files = 5

[alerting.prometheus]
enabled = true
listen_address = "127.0.0.1:9090"
endpoint = "/metrics"

[[agents]]
name = "claude-code"
process_name = "claude"
watch_children = true

[agents.file_access]
default = "deny"
allow = [
    "/home/suren/codebrahma/llm_allowed/**",
    "/home/suren/codebrahma/guardian_shell/**",
    "/home/suren/**",
    "/home/**",
    "/tmp/**",
    "/proc/**",
    "/sys/**",
    "/dev/**",
    "/usr/lib/**",
    "/usr/lib64/**",
    "/usr/share/**",
    "/usr/local/**",
    "/usr/bin/**",
    "/lib/**",
    "/lib64/**",
    "/bin/**",
    "/etc/ld.so.cache",
    "/etc/ssl/**",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/hostname",
    "/etc/passwd",
    "/etc/nsswitch.conf",
    "/etc/localtime",
    "/etc/claude-code/**",
    "/run/**",
    "/var/tmp/**",
]
deny = [
    "/home/suren/codebrahma/llm_not_allowed/**",
    "/etc/shadow",
    "/etc/gshadow",
    "/home/suren/.ssh/**",
    "/home/suren/.gnupg/**",
    "/home/suren/.aws/**",
]

[agents.exec_policy]
default = "deny"
allow = [
    "/usr/bin/**",
    "/usr/local/bin/**",
    "/bin/**",
]
deny = [
]

