# Guardian Shell — Recommended Configuration
# Default-deny policy with JSON logging and Prometheus metrics.
# Suitable for production use with LLM agents.

[global]
log_level = "info"
mode = "enforce"
pid_rescan_interval = 5
socket_path = "/run/guardian.sock"

# --- Alerting ---
[alerting]
min_severity = "warning"
dedup_window_seconds = 300
rate_limit_per_minute = 100

[alerting.json_log]
enabled = true
path = "/var/log/guardian/events.json"
max_size_mb = 100
max_files = 5

[alerting.prometheus]
enabled = true
listen_address = "127.0.0.1:9090"
endpoint = "/metrics"

# --- Agent: example LLM coding agent ---
[[agents]]
name = "coding-agent"
identity = "cgroup"

[agents.file_access]
default = "deny"
allow = [
    # Project workspace
    "/home/user/projects/workspace/**",
    # System libraries (needed for most programs)
    "/usr/lib/**",
    "/usr/lib64/**",
    "/usr/share/**",
    "/lib/**",
    "/lib64/**",
    # Temp and proc
    "/tmp/**",
    "/proc/**",
    # SSL certs and DNS
    "/etc/ssl/**",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ld.so.cache",
    "/etc/nsswitch.conf",
    "/etc/localtime",
    "/etc/passwd",
]
deny = [
    # Secrets and credentials
    "/home/user/.ssh/**",
    "/home/user/.aws/**",
    "/home/user/.gnupg/**",
    "/home/user/.config/gcloud/**",
    "/home/user/.kube/**",
    # System secrets
    "/etc/shadow",
    "/etc/gshadow",
]

[agents.exec_policy]
default = "allow"
allow = ["/usr/bin/**", "/usr/local/bin/**", "/bin/**"]
deny = ["/usr/bin/curl", "/usr/bin/wget", "/usr/bin/nc"]

[agents.resources]
memory_max = "4G"
pids_max = 200
