[global]
log_level = "info"
mode = "enforce"
pid_rescan_interval = 5
socket_path = "/run/guardian.sock"

# =============================================================================
# Comm-based agent (Phase 1/2 backward compatible)
# Identified by process name — works without guardian-launch
# =============================================================================
[[agents]]
name = "claude-code"
process_name = "claude"
watch_children = true

[agents.file_access]
default = "deny"
allow = [
    # Allowed test folder
    "/home/suren/codebrahma/llm_allowed/**",

    # Guardian Shell project
    "/home/suren/codebrahma/guardian_shell/**",

    # Home directory (Claude needs dotfiles, configs, etc.)
    "/home/suren/**",
    "/home/**",

    # System paths
    "/tmp/**",
    "/proc/**",
    "/sys/**",
    "/dev/**",
    "/usr/lib/**",
    "/usr/lib64/**",
    "/usr/share/**",
    "/usr/local/**",
    "/usr/bin/**",
    "/lib/**",
    "/lib64/**",
    "/bin/**",
    "/etc/ld.so.cache",
    "/etc/ssl/**",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/hostname",
    "/etc/passwd",
    "/etc/nsswitch.conf",
    "/etc/localtime",
    "/etc/claude-code/**",
    "/run/**",
    "/var/tmp/**",
]
deny = [
    # === THE TEST: Block this folder ===
    "/home/suren/codebrahma/llm_not_allowed/**",

    # Sensitive files
    "/etc/shadow",
    "/etc/gshadow",
    "/home/suren/.ssh/**",
    "/home/suren/.gnupg/**",
    "/home/suren/.aws/**",
]

[agents.exec_policy]
default = "allow"
allow = ["/usr/bin/**", "/usr/local/bin/**", "/bin/**"]
deny = []

# =============================================================================
# Alerting & Integration (Phase 4)
# All outputs are opt-in. Remove or comment sections you don't need.
# =============================================================================
[alerting]
min_severity = "warning"         # Global filter: "info", "warning", "critical"
dedup_window_seconds = 300       # Suppress duplicate alerts within this window
rate_limit_per_minute = 100      # Max alerts dispatched per minute

# --- Structured JSON Logging (SIEM-compatible, JSONL format) ---
[alerting.json_log]
enabled = true
path = "/var/log/guardian/events.json"
max_size_mb = 100                # Rotate when file exceeds this size
max_files = 5                    # Keep this many rotated files

