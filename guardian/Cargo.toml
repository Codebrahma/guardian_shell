# =============================================================================
# Guardian - Userspace Daemon
# =============================================================================
#
# This is the main userspace application. It:
#   1. Reads the security policy from a TOML config file
#   2. Discovers LLM agent processes by name
#   3. Loads the eBPF program into the kernel
#   4. Receives file access events from the eBPF program
#   5. Evaluates events against policy rules
#   6. Logs allowed/denied access attempts
#
# This program requires root privileges (or CAP_BPF + CAP_PERFMON capabilities)
# to load eBPF programs into the kernel.
#
# Usage:
#   sudo target/debug/guardian --config config.toml

[package]
name = "guardian"
version = "0.1.0"
edition = "2021"
description = "Userspace daemon for Guardian Shell - monitors LLM agent file access"

[dependencies]
# Aya - the Rust eBPF framework (userspace side)
# Provides APIs to load eBPF programs, manage maps, and read perf buffers
aya = { version = "0.13", features = ["async_tokio"] }

# Aya log integration - receives log messages from the eBPF program
# and forwards them to the standard Rust `log` facade
aya-log = "0.2"

# Our shared types (FileAccessEvent, constants)
guardian-common = { path = "../guardian-common", features = ["user"] }

# Async runtime - eBPF event processing is naturally async (waiting for events)
tokio = { version = "1", features = ["full"] }

# Configuration parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling - provides context-rich error chains
anyhow = "1"

# Byte buffer management for reading perf events
bytes = "1"

# Command-line argument parsing
clap = { version = "4", features = ["derive"] }

# Unix-specific system calls (kill, etc.)
libc = "0.2"

# Phase 4: Alerting & Integration
# HTTP client for webhook/Slack alerts (rustls avoids openssl dependency)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# SMTP email for alert notifications
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# Timestamps with ISO 8601 formatting
chrono = { version = "0.4", features = ["serde"] }
# Prometheus metrics for observability
prometheus = "0.13"

# Phase 5: Dashboard & UI
axum = { version = "0.8", features = ["macros"] }
askama = "0.12"
askama_axum = "0.4"
rust-embed = "8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
