# =============================================================================
# Guardian Shell - Configuration
# =============================================================================

[global]
log_level = "info"

# Operating mode:
#   "monitor" - Log allow/deny decisions but don't block access (Phase 1 behavior)
#   "enforce" - Actually block denied file access using LSM BPF hooks
mode = "enforce"

# How often (seconds) to rescan /proc for new agent processes
pid_rescan_interval = 5

# =============================================================================
# Agent Configurations
# =============================================================================

[[agents]]
name = "claude-code"
process_name = "claude"

# Track child processes spawned by this agent (default: true)
watch_children = true

# File access policy
[agents.file_access]
default = "deny"
allow = [
    "/home/user/projects/**",
    "/tmp/**",
    "/usr/lib/**",
    "/usr/share/**",
    "/lib/**",
    "/etc/hostname",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl/**",
    "/usr/share/zoneinfo/**",
    "/etc/ld.so.cache",
    "/proc/**",
]
deny = [
    "/etc/shadow",
    "/etc/gshadow",
    "/etc/sudoers",
    "/etc/sudoers.d/**",
    "/home/user/.ssh/**",
    "/root/.ssh/**",
    "/home/user/.gnupg/**",
    "/home/user/.aws/**",
    "/home/user/.azure/**",
    "/home/user/.config/gcloud/**",
    "/home/user/.kube/**",
    "/var/run/docker.sock",
    "/home/user/projects/**/.env",
    "/home/user/projects/**/.env.local",
    "/home/user/projects/**/.env.production",
    "/root/**",
    "/boot/**",
    "/proc/kcore",
    "/proc/kallsyms",
]

# Command execution policy (Phase 2)
[agents.exec_policy]
default = "allow"
allow = [
    "/usr/bin/**",
    "/usr/local/bin/**",
    "/bin/**",
]
deny = [
    "/usr/bin/rm",
    "/usr/bin/dd",
    "/usr/bin/mkfs",
    "/usr/sbin/**",
    "/usr/bin/passwd",
    "/usr/bin/chown",
    "/usr/bin/chmod",
]
