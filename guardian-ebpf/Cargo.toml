# =============================================================================
# Guardian eBPF - Kernel-Space Program
# =============================================================================
#
# This crate compiles to BPF bytecode that runs inside the Linux kernel.
# It is NOT a normal Rust program - key differences:
#
#   - Target: bpfel-unknown-none (BPF little-endian, no OS)
#   - No standard library (#![no_std])
#   - No main function (#![no_main]) - entry points are BPF program types
#   - No heap allocation, no threads, no filesystem access
#   - 512-byte stack limit per function
#   - Must pass the BPF verifier (kernel safety checker)
#
# Build this crate with:
#   cargo xtask build-ebpf [--release]
#
# DO NOT build with regular `cargo build` - it will fail because the default
# target is not BPF.

[package]
name = "guardian-ebpf"
version = "0.11.0"
edition = "2021"

[dependencies]
# Aya's eBPF runtime library - provides BPF program types, map definitions,
# and helper function wrappers for the kernel side.
aya-ebpf = "0.1"

# Our shared types (FileAccessEvent, constants)
guardian-common = { path = "../guardian-common" }

